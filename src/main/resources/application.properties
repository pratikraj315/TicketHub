spring.application.name=tickethub

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tickethub
spring.datasource.username=root
spring.datasource.password=root

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
#Allows Hibernate to update database tables based on our entities
spring.jpa.show-sql=true
#Displays SQL queries in the console
spring.jpa.properties.hibernate.format_sql=true
#Makes SQL output easier to read
spring.jpa.open-in-view=false
#It disables Open EntityManager in View, so database access stays within the service/transaction layer instead of happening later during HTTP response rendering.